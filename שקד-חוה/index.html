<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"Rubik",system-ui,Arial,sans-serif;color:#152029;background-color:#fafafa;background-image:repeating-linear-gradient(135deg,rgba(201,142,13,0.1) 0 10px,transparent 10px 24px),linear-gradient(180deg,#fafafa,#f8fafc);min-height:100vh;line-height:1.6;padding:0 0 40px}
.wrap{max-width:600px;margin:0 auto;padding:0 16px}
a{color:inherit;text-decoration:none}
h1{font-size:26px;margin:0;letter-spacing:-.02em}
h2{font-size:17px;margin:0 0 12px;letter-spacing:-.01em}
.mono{font-family:ui-monospace,Menlo,monospace}
.sec{margin:26px 0}
.card,.lnk,.cc,.sv,.ts,.pr,.fl,.wf,.frm,.cta,.qrb,.st,.tli,.faq details,.frame{border-radius:18px}
.hero{padding:30px 0 6px;text-align:center}
.hero .av{width:104px;height:104px;border-radius:50%;object-fit:cover;border:3px solid rgba(201,142,13,0.5);box-shadow:0 12px 30px -12px rgba(0,0,0,.4);margin-bottom:14px}
.hero .ht{color:#5E7484;font-weight:600;margin-top:4px}
.hero p{color:#5E7484;margin:10px auto 0;max-width:46ch;font-size:15px}
.hero.cover{padding:0 0 6px;margin:0 -16px 10px;background-image:var(--cv);background-size:cover;background-position:center;border-radius:0 0 18px 18px}
.hero.cover .hin{padding:44px 18px 26px;background:linear-gradient(rgba(255,255,255,0.15),rgba(255,255,255,0.88));border-radius:0 0 18px 18px}
.hero.split{display:flex;align-items:center;gap:16px;text-align:start}
.hero.split .sp{width:96px;height:96px;border-radius:18px;object-fit:cover;flex:none;box-shadow:0 10px 26px -12px rgba(0,0,0,.4)}
.hero.split h1{font-size:23px}
.hero.min{text-align:start;padding-top:36px}
.hero.card2{margin-top:24px;padding:26px 18px;background:rgba(255,255,255,.85);border:1px solid rgba(15,30,40,.07);box-shadow:0 6px 18px -10px rgba(0,0,0,.22)}
.lnk{display:flex;align-items:center;gap:12px;padding:14px;margin:10px 0;background:rgba(255,255,255,.85);border:1px solid rgba(15,30,40,.07);box-shadow:0 6px 18px -10px rgba(0,0,0,.22);border-inline-start:4px solid var(--c);transition:transform .16s,box-shadow .16s}
.lnk:active{transform:scale(.985)}
.lnk .li{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:rgba(201,142,13,0.13);color:var(--c);overflow:hidden}
.lnk .li img,.cc .ci img,.sv .si img,.fl .fi img{width:100%;height:100%;object-fit:cover;border-radius:12px}
.lt{flex:1;min-width:0}.lt b{display:block;font-size:15px}.lt i{display:block;font-style:normal;color:#5E7484;font-size:12.5px}
.lc{color:#5E7484;display:flex}
.cards{display:grid;gap:12px}
.cc{padding:14px;background:rgba(255,255,255,.85);border:1px solid rgba(15,30,40,.07);box-shadow:0 6px 18px -10px rgba(0,0,0,.22)}
.ch{display:flex;align-items:center;gap:11px;margin-bottom:11px}
.ci{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(201,142,13,0.14);color:#c98e0d;flex:none;overflow:hidden}
.ci img{border-radius:50%}
.ch b{display:block;font-size:15px}.ch i{font-style:normal;color:#5E7484;font-size:12.5px}
.cb{display:flex;gap:7px;flex-wrap:wrap}
.cb a,.cb button,.cpy,.frm button,.cta a{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;font-size:13px;font-weight:600;border:0;cursor:pointer;font-family:inherit;background:rgba(201,142,13,0.13);color:#c98e0d}
.cb button{background:#c98e0d;color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px}
.st{padding:16px 10px;text-align:center;background:rgba(255,255,255,.85);border:1px solid rgba(15,30,40,.07);box-shadow:0 6px 18px -10px rgba(0,0,0,.22)}
.st .si{color:#c98e0d;display:block;margin-bottom:5px}
.st b{display:block;font-size:26px;letter-spacing:-.03em;color:#c98e0d}
.st i{font-style:normal;color:#5E7484;font-size:12.5px}
.svcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px}
.sv{padding:15px;background:rgba(255,255,255,.85);border:1px solid rgba(15,30,40,.07);box-shadow:0 6px 18px -10px rgba(0,0,0,.22)}
.sv .si{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(255,212,184,0.15);color:#ffd4b8;margin-bottom:9px;overflow:hidden}
.sv b{font-size:14.5px}.sv p{margin:5px 0 0;color:#5E7484;font-size:13px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.gal figure{margin:0;position:relative}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:calc(18px - 4px);cursor:zoom-in;display:block}
.gal figcaption{font-size:11.5px;color:#5E7484;padding:4px 2px}
.tsts{display:grid;gap:11px}
.ts{margin:0;padding:15px;background:rgba(255,255,255,.85);border:1px solid rgba(15,30,40,.07);box-shadow:0 6px 18px -10px rgba(0,0,0,.22)}
.ts .stars{color:#F0A93B;display:flex;gap:2px;margin-bottom:7px}
.ts p{margin:0;font-size:14.5px}
.ts footer{display:flex;align-items:center;gap:9px;margin-top:11px;color:#5E7484}
.ts footer img{width:34px;height:34px;border-radius:50%;object-fit:cover}
.ts footer b{color:#152029;font-size:13.5px;display:block}.ts footer i{font-style:normal;font-size:12px}
.prcs{display:grid;gap:10px}
.pr{padding:15px;position:relative;background:rgba(255,255,255,.85);border:1px solid rgba(15,30,40,.07);box-shadow:0 6px 18px -10px rgba(0,0,0,.22)}
.pb{position:absolute;inset-inline-end:12px;top:12px;background:#ffd4b8;color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px}
.pn{font-weight:700;font-size:15px}
.pp{font-size:24px;font-weight:800;color:#c98e0d;letter-spacing:-.03em}
.pp small{font-size:12px;color:#5E7484;font-weight:500;margin-inline-start:4px}
.pr p{margin:4px 0 0;color:#5E7484;font-size:13px}
.tl{position:relative;padding-inline-start:22px}
.tl:before{content:"";position:absolute;inset-inline-start:5px;top:6px;bottom:6px;width:2px;background:rgba(201,142,13,0.3)}
.tli{position:relative;margin-bottom:14px;padding:12px;background:rgba(255,255,255,.85);border:1px solid rgba(15,30,40,.07);box-shadow:0 6px 18px -10px rgba(0,0,0,.22)}
.tli:before{content:"";position:absolute;inset-inline-start:-21px;top:18px;width:10px;height:10px;border-radius:50%;background:#c98e0d}
.td{font-size:12px;color:#c98e0d;font-weight:700}
.tli b{display:block;font-size:14.5px}.tli p{margin:3px 0 0;color:#5E7484;font-size:13px}
.faq details{margin:8px 0;padding:0 14px;background:rgba(255,255,255,.85);border:1px solid rgba(15,30,40,.07);box-shadow:0 6px 18px -10px rgba(0,0,0,.22)}
.faq summary{list-style:none;cursor:pointer;padding:13px 0;font-weight:600;font-size:14.5px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.faq summary::-webkit-details-marker{display:none}
.faq summary svg{color:#5E7484;transition:transform .2s;flex:none}
.faq details[open] summary svg{transform:rotate(180deg)}
.faq p{margin:0 0 13px;color:#5E7484;font-size:14px}
.hrs{background:rgba(255,255,255,.85);border:1px solid rgba(15,30,40,.07);box-shadow:0 6px 18px -10px rgba(0,0,0,.22);padding:6px 14px}
.hr2{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(201,142,13,0.12);font-size:14px}
.hr2:last-child{border:0}.hr2 span{color:#5E7484}
.fls{display:grid;gap:9px}
.fl{display:flex;align-items:center;gap:11px;padding:12px;background:rgba(255,255,255,.85);border:1px solid rgba(15,30,40,.07);box-shadow:0 6px 18px -10px rgba(0,0,0,.22);color:#152029}
.fl .fi{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:rgba(201,142,13,0.13);color:#c98e0d;flex:none;overflow:hidden}
.socs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.socs a{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:rgba(201,142,13,0.12);color:var(--c)}
.txt{padding:15px;background:rgba(255,255,255,.85);border:1px solid rgba(15,30,40,.07);box-shadow:0 6px 18px -10px rgba(0,0,0,.22);font-size:14.5px}
.cta{padding:22px 18px;text-align:center;background:linear-gradient(150deg,#c98e0d,#ffd4b8);color:#fff;box-shadow:0 14px 34px -14px rgba(201,142,13,0.7)}
.cta b{font-size:19px;display:block}
.cta p{margin:6px 0 12px;opacity:.9;font-size:14px}
.cta a{background:#fff;color:#c98e0d}
.frame{overflow:hidden;background:rgba(255,255,255,.85);border:1px solid rgba(15,30,40,.07);box-shadow:0 6px 18px -10px rgba(0,0,0,.22)}
.frame iframe{width:100%;height:230px;border:0;display:block}
.frame.ratio iframe{aspect-ratio:16/9;height:auto}
.wf{display:flex;align-items:center;gap:12px;padding:14px;background:rgba(255,255,255,.85);border:1px solid rgba(15,30,40,.07);box-shadow:0 6px 18px -10px rgba(0,0,0,.22);color:#c98e0d}
.wf b{display:block;color:#152029;font-size:15px}.wf i{font-style:normal;color:#5E7484;font-size:13px}
.wf div{flex:1;min-width:0}
.frm{padding:15px;display:grid;gap:9px;background:rgba(255,255,255,.85);border:1px solid rgba(15,30,40,.07);box-shadow:0 6px 18px -10px rgba(0,0,0,.22)}
.frm input,.frm textarea{width:100%;padding:11px;border-radius:11px;border:1px solid rgba(201,142,13,0.25);background:#fff;color:#152029;font-family:inherit;font-size:15px}
.frm textarea{min-height:82px;resize:vertical}
.frm button{justify-content:center;background:#c98e0d;color:#fff;padding:12px}
.frm small{color:#5E7484;font-size:12px;text-align:center}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.cd div{padding:12px 4px;background:rgba(255,255,255,.85);border:1px solid rgba(15,30,40,.07);box-shadow:0 6px 18px -10px rgba(0,0,0,.22)}
.cd b{display:block;font-size:24px;color:#c98e0d;font-variant-numeric:tabular-nums}
.cd i{font-style:normal;font-size:11.5px;color:#5E7484}
.cdn{text-align:center;color:#5E7484;font-size:13px;margin-top:8px}
.qrb{text-align:center;padding:18px;background:rgba(255,255,255,.85);border:1px solid rgba(15,30,40,.07);box-shadow:0 6px 18px -10px rgba(0,0,0,.22)}
.qrb img{border-radius:12px;background:#fff;padding:8px}
.qrb p{color:#5E7484;font-size:13px;margin:9px 0 0}
.dv{height:1px;background:rgba(201,142,13,0.22);margin:6px 0}
footer.pf{text-align:center;color:#5E7484;font-size:12.5px;padding:26px 0 10px}
.fab{position:fixed;inset-inline-end:16px;bottom:16px;width:52px;height:52px;border-radius:50%;border:0;cursor:pointer;background:#c98e0d;color:#fff;display:grid;place-items:center;box-shadow:0 12px 26px -8px rgba(201,142,13,0.8);z-index:9}
.fab.up{inset-inline-end:auto;inset-inline-start:16px;background:#fff;color:#c98e0d;opacity:0;pointer-events:none;transition:.25s}
.fab.up.on{opacity:1;pointer-events:auto}
#lb{position:fixed;inset:0;background:rgba(8,14,18,.92);display:none;place-items:center;z-index:20;padding:18px}
#lb.on{display:grid}#lb img{max-width:100%;max-height:88vh;border-radius:14px}
#tst{position:fixed;inset-inline:0;bottom:22px;display:flex;justify-content:center;z-index:30;pointer-events:none}
#tst span{background:#152029;color:#fff;padding:9px 16px;border-radius:12px;font-size:13.5px;opacity:0;transition:.25s;transform:translateY(8px)}
#tst span.on{opacity:1;transform:none}
.sec,.hero{opacity:0;transform:translateY(14px)}.sec.in,.hero.in{opacity:1;transform:none;transition:opacity .55s ease,transform .55s cubic-bezier(.2,.8,.2,1)}
@media(prefers-reduced-motion:reduce){.sec,.hero{opacity:1!important;transform:none!important}}

</style>

(function(){

  function vcf(c){var L=["BEGIN:VCARD","VERSION:3.0","N:"+(c.last||"")+";"+(c.first||"")+";;;",

    var n=(document.getElementById("f-n")||{}).value||"",p=(document.getElementById("f-p")||{}).value||"",m=(document.getElementById("f-m")||{}).value||"";
    if(!n&&!m){T("צריך למלא שם והודעה");return}
    var dest=(D.form&&D.form.dest)||"";var body="שם: "+n+"\nיצירת קשר: "+p+"\n\n"+m;
    if(dest.indexOf("@")>0)location.href="mailto:"+dest+"?subject="+encodeURIComponent("פנייה מהדף")+"&body="+encodeURIComponent(body);
    else location.href="https://wa.me/"+dest.replace(/\D/g,"")+"?text="+encodeURIComponent(body)});
  if(D.countdown){var t=new Date(D.countdown).getTime();
    var tick=function(){var s=Math.max(0,Math.floor((t-Date.now())/1000));
      var set=function(id,v){var e=document.getElementById(id);if(e)e.textContent=v};
      set("cd-d",Math.floor(s/86400));set("cd-h",Math.floor(s%86400/3600));set("cd-m",Math.floor(s%3600/60));set("cd-s",s%60)};
    tick();setInterval(tick,1000)}
  var qi=document.getElementById("qri");
  if(qi)qi.src="https://api.qrserver.com/v1/create-qr-code/?size=360x360&margin=0&data="+encodeURIComponent(location.href);
  var rev=[].slice.call(document.querySelectorAll(".sec,.hero"));
  if(D.anim&&"IntersectionObserver" in window&&!matchMedia("(prefers-reduced-motion:reduce)").matches){
    var io=new IntersectionObserver(function(en){en.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}})},{threshold:.08});
    rev.forEach(function(el){io.observe(el)})}
  else rev.forEach(function(el){el.classList.add("in")});
  if(D.counter){try{var k="v_"+location.pathname;var n=(+localStorage.getItem(k)||0)+1;localStorage.setItem(k,n);
    var e=document.getElementById("hits");if(e)e.textContent="ביקור מספר "+n+" מהמכשיר הזה"}catch(e){}}
})();
</script>
</body></html>
